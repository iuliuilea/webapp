name: Docker Image CI

on:
  push:
    branches: master

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT }}
#   GCE_INSTANCE: my-githubactions-vm  # TODO: update to instance name
#   GCE_INSTANCE_ZONE: us-central1-a   # TODO: update to instance zone

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3
    # Configure Workload Identity Federation and generate an access token.

    # authentication via credentials json
    - id: 'auth'
      uses: 'google-github-actions/auth@v0'
      with:
        credentials_json: '${{ secrets.GCP_SA_KEY }}'
    # Setup gcloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v0
      
    # Configure Docker to use the gcloud command-line tool as a credential
    # helper for authentication
    - run: |-
        gcloud --quiet auth configure-docker europe-west3-docker.pkg.dev

    # Build the Docker image
    - name: Build
      run: |-
        docker build --tag "europe-west3-docker.pkg.dev/ninth-expanse-225308/webapp:latest" .

    - name: List Docker image
      run: docker images
    # Push the Docker image to Google Container Registry
    - name: Publish
      run: |-
        docker push "europe-west3-docker.pkg.dev/ninth-expanse-225308/webapp:latest"
